# The simplest version of the product-catalog Application, for showing what a
# KubeVela app looks like at its smallest: two components, no policies, no
# workflow. KubeVela deploys both to the current namespace and keeps them
# running.
#
# Not part of demo.sh. product-catalog.yaml is the full version: the same two
# components, promoted through four stages by a workflow.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: product-catalog-simple
  namespace: default
spec:
  components:
    - name: product-images
      type: bucket-aws-cue
      properties:
        name: product-images
        region: us-west-2
        projectName: kubecon-na-2026

    - name: product-catalog-api
      type: webservice
      properties:
        image: product-catalog:latest
        ports:
          - port: 8080
            expose: true
        env:
          - {name: PORT, value: "8080"}
          - {name: STORAGE_PROVIDER, value: aws}
          - {name: AWS_REGION, value: us-west-2}
          - {name: AWS_ENDPOINT_URL, value: "http://floci.floci-system.svc.cluster.local:4566"}
          - {name: AWS_ACCESS_KEY_ID, value: test}
          - {name: AWS_SECRET_ACCESS_KEY, value: test}
          # The bucket component appends the namespace to its name.
          - {name: BUCKET_NAME, value: product-images-default}
